# =====================================================================
# hmdp-plus-rag · OpenResty 网关
#   1) 共享字典令牌桶：挡全局洪峰（Java 侧还有按账号的滑动窗口）
#   2) 赛事详情缓存：共享字典 + 子请求回源，命中直接返回，不打到 Java
#
# 用法：把 http { } 里除了 upstream 之外的内容整体放进你的 nginx.conf，
#       lua_package_path 指向本目录（.../openresty/lua/?.lua）。
# =====================================================================

# openresty -p . -c conf/nginx.conf

worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # lua 模块搜索路径（按实际部署路径改）
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # 限流状态：16m 足够存两个 key + 锁；不用 Redis 是为了在 Java/Redis 挂掉时仍然挡得住
    lua_shared_dict rate_limit  16m;
    # 赛事详情缓存：128m，约可存 2~3 万个赛事详情
    lua_shared_dict event_cache 128m;

    upstream app_backend {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # ---------------- 报名写入口：全局令牌桶 ----------------
        # 1000/s 补充，桶 3000（允许 3 秒的正常突发）
        # 这一层只管"总量"，不管"谁"，按账号的公平性交给 Java 的滑动窗口
        location /registration/ {
            access_by_lua_block {
                -- 注意：location 里不能 require 到局部变量后复用，
                -- 所以这里每次取（package.loaded 缓存，开销可忽略）
                local tb = require("token_bucket")
                local dict = ngx.shared.rate_limit
                if not tb.allow(dict, "register", 1000, 3000) then
                    ngx.header["X-RateLimit-Layer"] = "gateway"
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json;charset=utf-8"
                    ngx.say('{"success":false,"errorMsg":"当前报名人数过多，请稍后重试"}')
                    return ngx.exit(429)
                end
            }
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------- 赛事详情：共享字典缓存 ----------------
        # 只缓存无需登录的读接口，且用子请求回源（不用 body_filter）
        location ~ ^/event/(\d+)$ {
            content_by_lua_block {
                local cache = ngx.shared.event_cache
                local key = "event:" .. ngx.var.uri
                local body = cache:get(key)

                if body then
                    ngx.header["X-Cache"] = "HIT"
                    ngx.print(body)
                    return
                end

                -- 子请求回源，后端仍然是 Java
                local res = ngx.location.capture("/_internal" .. ngx.var.uri)
                if res.status == 200 and res.body and #res.body > 0 then
                    -- TTL 加 ±60s 抖动：避免一批 key 同时失效造成回源尖峰
                    local ttl = 600 + math.random(0, 60)
                    cache:set(key, res.body, ttl)
                    ngx.header["X-Cache"] = "MISS"
                    ngx.print(res.body)
                else
                    -- 回源失败不写缓存，直接透传错误码
                    ngx.status = res.status
                    ngx.print(res.body or "")
                end
            }
        }

        location /_internal/ {
            internal;
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
        }

        # ---------------- 其他接口：直接透传 ----------------
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

# ---------------------------------------------------------------------
# 关于 pro 版 body_filter_by_lua_block 的那个坑（已规避）：
#   原写法在 body_filter 里直接 cache:set(...)，但没有判断 ngx.arg[2]
#   （eof 标记）。大响应会被拆成多块，每块都 set 一次，最后写进缓存的是
#   最后一块，也就是被截断的尾巴。
#   这里改用 content_by_lua + ngx.location.capture 拿完整 body，
#   从根本上避开流式截断问题；如果确实需要在流式场景缓存，必须写成：
#     if not ngx.arg[2] then  buffer = buffer .. (ngx.arg[1] or "")  return end
#   即只在 eof 时落盘。
# ---------------------------------------------------------------------
