# 赛事助手（RAG）与报名系统共用的基础设施
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 起完之后的端口：
#   6379  Redis   —— Java 侧登录态/名额余量，Python 侧答案缓存与限流
#   19530 Milvus  —— 向量库（.env 里 RAG_MILVUS_URI=http://127.0.0.1:19530）
#   9091  Milvus 指标端口
#
# 只在本机开发用：Redis 没设密码，Milvus 用嵌入式 etcd + 本地存储，单机单副本。
# 注意 Milvus 官方 compose 默认要挂 etcd 和 MinIO 两个容器，这里用
# ETCD_USE_EMBED=true + COMMON_STORAGETYPE=local 把它们去掉了，少两个镜像。

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/advanced/etcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  redis_data:
  milvus_data:
