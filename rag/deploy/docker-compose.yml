# 野径 · 赛事助手（RAG）—— 第二条命令
#
#   docker compose -f rag/deploy/docker-compose.yml up -d --build
#   docker compose -f rag/deploy/docker-compose.yml logs -f rag-app
#
# 三个容器：
#   rag-app    FastAPI 检索问答服务   8090
#   rag-redis  助手自己的 Redis       6380   （答案缓存 + 令牌桶限流，和主链路分开）
#   milvus     向量库（嵌入式 etcd + 本地存储）19530 / 9091
#
# 与主链路的关系：主链路容器通过 host.docker.internal:8090 调它；助手挂了只影响问答，
# 报名与支付不受影响（Java 侧 RagClient 会降级）。
#
# 第一次启动会调 embedding API 把 8 篇语料建成索引（约 20~40 秒）；
# 之后索引在 Milvus 数据卷里，重启不重建。想强制重建：RAG_INGEST_ON_START=force。
#
# 密钥等配置来自 rag/.env（不进 git）：cp .env.example .env 后填 key。

name: yejing-rag

services:
  rag-redis:
    image: redis:latest
    container_name: yejing-rag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RAG_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - rag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: yejing-rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
      # 官方 standalone 要另起 etcd + MinIO，这里用嵌入式 etcd + 本地存储省掉两个容器
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/advanced/etcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_METRICS_HOST_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  rag-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: yejing/rag:local
    container_name: yejing-rag-app
    restart: unless-stopped
    # rag/.env 里有 LLM / embedding / rerank 的 key；缺失时不阻塞启动（required: false）
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: Asia/Shanghai
      RAG_HOST: 0.0.0.0
      RAG_PORT: "8090"
      # 容器内用服务名寻址，覆盖 .env 里的 127.0.0.1
      STORE_BACKEND: milvus
      RAG_MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: rag_chunks
      MILVUS_METRIC: COSINE
      REDIS_URL: redis://rag-redis:6379/0
      RAG_CACHE_ENABLED: "true"
      RAG_SHARED_SECRET: ${RAG_SHARED_SECRET:-yejing-rag-2026-local-dev}
      RAG_INGEST_ON_START: ${RAG_INGEST_ON_START:-1}
      MILVUS_HEALTH_URL: http://milvus:9091/healthz
    ports:
      - "${RAG_HOST_PORT:-8090}:8090"
    volumes:
      # 父块（small-to-big 用的 parents.json）在文件系统上，不在向量库里；
      # 不持久化的话容器重建后会悄悄退化成“只用子块”。
      - rag_index_data:/app/data/index
    depends_on:
      rag-redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  rag_redis_data:
  milvus_data:
  rag_index_data:
