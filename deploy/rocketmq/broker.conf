# RocketMQ Broker 配置（Docker Compose 版）
#
# 与宿主机版（E:\rocketmq\...\conf\broker-local.conf）的差别只有 brokerIP1：
# 容器外的进程要连 Broker 时，Broker 返回的地址必须是它们能解析的。
#   - 本文件用 brokerIP1 = broker，因为客户端（app / canal）都在同一个 compose 网络里；
#   - 宿主机上的 Java/Python 进程连容器里的 Broker，则要改成 brokerIP1 = 127.0.0.1。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# NameServer 地址（容器名寻址）
namesrvAddr = namesrv:9876

# 对外通告地址：容器网络内的服务名
brokerIP1 = broker
listenPort = 10911

# 开发环境省事：topic / 订阅组不存在时自动创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 单机开发：日志留在容器内即可
deleteWhen = 04
fileReservedTime = 48
